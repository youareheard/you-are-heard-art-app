services:
  - type: web
    name: you-are-heard-art-expression
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: art-expression-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: DATA_DIR
        value: /var/data
      - key: SITE_TITLE
        value: You Are Heard — Art & Expression
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
